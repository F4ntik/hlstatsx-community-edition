name: Nightly Parity Acceptance

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      max_import_files:
        description: Maximum import files for the heavy parity replay
        required: false
        default: '1000'
      run_heavy_parity_gate:
        description: Run the Docker-backed parity gate
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  replay-helper-smoke:
    name: Replay helper smoke
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts:scripts/replay_baseline
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: python -m pip install pytest==7.4.3

      - name: Run lightweight replay helper tests
        run: python -m pytest scripts/replay_baseline/tests

  heavy-parity-gate:
    name: Heavy parity replay
    needs: replay-helper-smoke
    runs-on: [self-hosted, Windows, parity]
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run_heavy_parity_gate == 'true' }}
    env:
      PYTHONPATH: scripts;scripts/replay_baseline
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Docker-backed dual replay
        id: dual-replay
        shell: powershell
        run: |
          $maxImportFiles = [int] "${{ github.event.inputs.max_import_files || '1000' }}"
          & scripts/replay_baseline/comparison/Run-DualContour-1000.ps1 `
            -UseDumpRestore `
            -ReuseValidLegacy `
            -MaxImportFiles $maxImportFiles

      - name: Run post-replay GeoIP backfill
        id: geoip-backfill
        shell: powershell
        run: |
          docker exec hlstatsx-python-worker `
            python -m hlstats_awards_py `
            --configfile /app/hlstats.conf `
            --geoip

      - name: Compare replay databases
        id: database-compare
        shell: powershell
        run: |
          python scripts/replay_baseline/compare_stats_dbs.py --max-examples 20

      - name: Smoke replay-backed EN/RU web routes
        id: web-smoke
        shell: powershell
        run: |
          python scripts/replay_baseline/web_route_smoke.py `
            --base-url http://127.0.0.1:8281 `
            --langs en ru

      - name: Package sanitized parity summary
        if: always()
        id: package-summary
        shell: powershell
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'hlstatsx-ci-artifacts'
          python scripts/replay_baseline/package_ci_artifacts.py `
            --output-directory $artifactDirectory `
            --max-import-files ${{ github.event.inputs.max_import_files || '1000' }} `
            --dual-replay-outcome '${{ steps.dual-replay.outcome }}' `
            --geoip-backfill-outcome '${{ steps.geoip-backfill.outcome }}' `
            --database-compare-outcome '${{ steps.database-compare.outcome }}' `
            --web-smoke-outcome '${{ steps.web-smoke.outcome }}'
          "artifact_file=$artifactDirectory/nightly-parity-summary.json" >> $env:GITHUB_OUTPUT

      - name: Upload sanitized parity summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-parity-summary
          retention-days: 7
          if-no-files-found: error
          path: ${{ steps.package-summary.outputs.artifact_file }}
