[tool.poetry]
name = "hlx-core"
version = "0.1.0"
description = "Shared Python infrastructure for the HLstatsX product lane."
authors = ["HLstatsX Community Edition"]
packages = [{ include = "hlx_core", from = ".." }]

[tool.poetry.dependencies]
python = "^3.10"
mysqlclient = "^2.2.0"

[tool.poetry.group.dev.dependencies]
black = "^23.12.1"
ruff = "^0.1.7"
mypy = "^1.7.1"
pytest = "^7.4.3"

[build-system]
requires = ["poetry-core>=1.6.1"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
packages = ["hlx_core"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
