version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hlstatsx-proxy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hlstatsx_proxy
      MYSQL_USER: hlstats
      MYSQL_PASSWORD: hlstats
    ports:
      - "33060:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
